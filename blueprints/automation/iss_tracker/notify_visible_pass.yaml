blueprint:
  name: ISS visible pass notification
  description: >-
    Sends a phone notification shortly before the International Space Station
    is visible from your location, and optionally a daily heads-up when a
    visible pass is coming up in the next 24 hours. Requires the ISS Tracker
    integration. The advance notice is set in the integration's options
    ("Advance notice").
  domain: automation
  source_url: https://github.com/kedube/ha-iss-tracker/blob/main/blueprints/automation/iss_tracker/notify_visible_pass.yaml
  input:
    next_visible_pass:
      name: Next visible pass sensor
      selector:
        entity:
          filter:
            - integration: iss_tracker
              domain: sensor
              device_class: timestamp
    visible_pass_soon:
      name: Visible pass soon sensor
      selector:
        entity:
          filter:
            - integration: iss_tracker
              domain: binary_sensor
    notify_device:
      name: Phone to notify
      description: A device running the Home Assistant Companion app.
      selector:
        device:
          filter:
            - integration: mobile_app
    daily_heads_up:
      name: Send a daily heads-up
      description: Also notify at a fixed time when a visible pass is due in the next 24 hours.
      default: true
      selector:
        boolean:
    heads_up_time:
      name: Daily heads-up time
      default: "16:00:00"
      selector:
        time:

mode: queued

triggers:
  - trigger: state
    entity_id: !input visible_pass_soon
    from: "off"
    to: "on"
    id: soon
  # With an advance notice longer than the gap between two passes (about 90
  # minutes), "soon" stays on from one pass to the next; announce the next
  # one when the pass sensor moves on to it. Waiting a second lets "soon"
  # settle first; if it turned on after the move, its own trigger has
  # already announced the pass. Setting not_from/not_to also ignores
  # attribute changes.
  - trigger: state
    entity_id: !input next_visible_pass
    not_from: [unknown, unavailable]
    not_to: [unknown, unavailable]
    for:
      seconds: 1
    id: soon_next
  - trigger: time
    at: !input heads_up_time
    id: daily

variables:
  pass_sensor: !input next_visible_pass
  soon_sensor: !input visible_pass_soon
  daily_enabled: !input daily_heads_up
  start_ts: "{{ as_timestamp(states(pass_sensor), 0) }}"
  minutes_away: "{{ ((start_ts - as_timestamp(now())) / 60) | round(0) | int }}"
  time_text: "{{ start_ts | timestamp_custom('%-I:%M %p') }}"
  day_text: >-
    {% set d = (start_ts | timestamp_custom('%Y-%m-%d')) %}
    {% if d == now().strftime('%Y-%m-%d') %}today{% elif d == (now() + timedelta(days=1)).strftime('%Y-%m-%d') %}tomorrow{% else %}{{ start_ts | timestamp_custom('%A') }}{% endif %}
  details: >-
    {% set a = namespace(
      start_dir=state_attr(pass_sensor, 'start_direction'),
      start_el=state_attr(pass_sensor, 'start_elevation') | float(0),
      peak_dir=state_attr(pass_sensor, 'peak_direction'),
      peak_el=state_attr(pass_sensor, 'peak_elevation') | float(0),
      end_dir=state_attr(pass_sensor, 'end_direction'),
      shadow=state_attr(pass_sensor, 'disappears_into_shadow'),
      seconds=state_attr(pass_sensor, 'duration_seconds') | float(0),
      mag=state_attr(pass_sensor, 'magnitude')) %}
    Appears in the {{ a.start_dir }} ({{ a.start_el | round(0) | int }}° up),
    climbs to {{ a.peak_el | round(0) | int }}° in the {{ a.peak_dir }},
    {% if a.shadow %}fades into Earth's shadow{% else %}sets{% endif %}
    in the {{ a.end_dir }}. Visible for {{ (a.seconds / 60) | round(1) }} min{% if a.mag is not none %}, brightness {{ a.mag }}{% endif %}.

conditions:
  - condition: template
    value_template: "{{ start_ts > 0 }}"
  - condition: or
    conditions:
      - condition: trigger
        id: soon
      - condition: and
        conditions:
          - condition: trigger
            id: soon_next
          - condition: state
            entity_id: !input visible_pass_soon
            state: "on"
          # A later pass, not the same one refined by a few seconds (passes
          # are at least 85 minutes apart), one still to come, and one that
          # "soon" has not announced already.
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.to_state is not none
                 and as_timestamp(trigger.to_state.state, 0)
                   - as_timestamp(trigger.from_state.state, 0) > 1800
                 and start_ts > as_timestamp(now())
                 and states[soon_sensor].last_changed < trigger.to_state.last_changed }}
      - condition: and
        conditions:
          - condition: trigger
            id: daily
          - condition: template
            value_template: "{{ daily_enabled and 0 < start_ts - as_timestamp(now()) < 86400 }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: [soon, soon_next]
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "ISS visible in {{ minutes_away }} min"
            message: "Look up at {{ time_text }}. {{ details }}"
    default:
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        title: "ISS visible {{ day_text }} at {{ time_text }}"
        message: "{{ details }}"

name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand images are not submitted to home-assistant/brands yet.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pinned, so a new ruff release cannot fail CI on code that has not changed.
      - run: pip install -r requirements_test.txt ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      # The manifest allows sgp4 2.20; run the whole suite on that floor too.
      - run: pip install "sgp4==2.20"
      - run: pytest
      # Quoted, so Node expands the glob itself (a directory argument fails on Node 22).
      - run: node --test "tests/js/*.test.mjs"
      - name: Check the frontend modules parse
        run: for f in custom_components/iss_pass_prediction/frontend/*.js; do node --check "$f"; done

  # Once every check has passed on main, publish the version in manifest.json
  # as a release (tag and title "1.01", no "v"), unless that version is already
  # released. Raise it with: python scripts/version.py bump
  release:
    needs: [hassfest, hacs, tests]
    if: github.ref == 'refs/heads/main' && github.repository == 'kedube/ha-iss-pass-prediction'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release decision at a time, so two quick pushes cannot both publish.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { gh release list --limit 1000 --json tagName --jq '.[].tagName'
            git ls-remote --tags --refs origin | sed 's|.*refs/tags/||'
          } | python3 scripts/version.py plan >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
